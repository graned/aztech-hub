name: aztech-opencode-workspace-manager-prod

services:
  app:
    build:
      context: .
      target: runner
    image: aztech-opencode-workspace-manager:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${WORKSPACE_URL:?WORKSPACE_URL is required}
      OPENCODE_WEB_URL: ${CODING_URL:?CODING_URL is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      OPENCODE_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:?OPENCODE_SERVER_USERNAME is required}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKSPACE_ROOT: /workspaces
    volumes:
      - workspace-data:/workspaces
    depends_on:
      mongodb:
        condition: service_healthy
      opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app

  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    image: aztech-opencode-workspace-manager:opencode-prod
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:?OPENCODE_SERVER_USERNAME is required}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
      - workspace-data:/workspaces
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$OPENCODE_SERVER_USERNAME:$$OPENCODE_SERVER_PASSWORD\" http://127.0.0.1:4096/doc || curl -fsS http://127.0.0.1:4096/doc"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      opencode:
        condition: service_healthy
    environment:
      WORKSPACE_URL: ${WORKSPACE_URL:?WORKSPACE_URL is required}
      CODING_URL: ${CODING_URL:?CODING_URL is required}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-admin}
      BASIC_AUTH_PASSWORD_HASH: ${BASIC_AUTH_PASSWORD_HASH:?BASIC_AUTH_PASSWORD_HASH is required}
      OPENCODE_BASIC_AUTH: ${OPENCODE_BASIC_AUTH:?OPENCODE_BASIC_AUTH is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app

networks:
  app:
    name: aztech-opencode-workspace-manager-prod
    driver: bridge

volumes:
  workspace-data:
    name: aztech-opencode-workspace-manager-prod-workspaces
  mongo-data:
    name: aztech-opencode-workspace-manager-prod-mongo
  opencode-data:
    name: aztech-opencode-workspace-manager-prod-opencode-data
  opencode-config:
    name: aztech-opencode-workspace-manager-prod-opencode-config
  caddy-data:
    name: aztech-opencode-workspace-manager-prod-caddy-data
  caddy-config:
    name: aztech-opencode-workspace-manager-prod-caddy-config
